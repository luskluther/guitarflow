<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GuitarFlow 1024 × 768 acceptance viewport</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #211e1b; }
      body { position: relative; }
      iframe { position: absolute; top: 50%; left: 50%; width: 1024px; height: 768px; display: block; border: 0; background: #f5f1eb; transform: translate(-50%, -50%) scale(.91); transform-origin: center; box-shadow: 0 18px 60px #0009; }
      output { position: fixed; z-index: 2; top: 8px; left: 8px; padding: 5px 8px; border-radius: 6px; color: #fff; background: #211e1bdd; font: 700 11px system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <output>1024 × 768</output>
    <iframe title="GuitarFlow 1024 by 768 viewport" src="/"></iframe>
  </body>
</html>
