<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GuitarFlow 1920 px visual acceptance harness</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; overflow-x: hidden; background: #eceef2; }
      #stage { width: 1920px; height: 1920px; transform-origin: top left; }
      iframe { display: block; width: 1920px; height: 1920px; border: 0; background: #fbfbfd; }
    </style>
  </head>
  <body>
    <div id="stage"><iframe id="app" src="/" title="GuitarFlow reference viewport"></iframe></div>
    <script>
      const stage = document.querySelector("#stage");
      const fit = () => {
        const scale = window.innerWidth / 1920;
        stage.style.transform = `scale(${scale})`;
        document.body.style.height = `${1920 * scale}px`;
      };
      addEventListener("resize", fit);
      fit();
    </script>
  </body>
</html>
