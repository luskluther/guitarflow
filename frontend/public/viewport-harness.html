<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GuitarFlow viewport harness</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #211e1b; }
      body { display: grid; place-items: center; }
      #stage { position: relative; transform-origin: center; box-shadow: 0 18px 60px #0009; }
      iframe { display: block; border: 0; background: #f5f1eb; }
      output { position: fixed; z-index: 2; top: 8px; left: 8px; padding: 5px 8px; border-radius: 6px; color: #fff; background: #211e1bdd; font: 700 11px system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <output id="label"></output>
    <div id="stage"><iframe id="app" title="GuitarFlow responsive acceptance viewport" src="/" /></div>
    <script>
      const params = new URLSearchParams(location.search);
      const width = Math.max(320, Number(params.get("w")) || 1920);
      const height = Math.max(568, Number(params.get("h")) || 1080);
      const frame = document.querySelector("#app");
      const stage = document.querySelector("#stage");
      const label = document.querySelector("#label");
      frame.width = width;
      frame.height = height;
      stage.style.width = `${width}px`;
      stage.style.height = `${height}px`;
      label.textContent = `${width} × ${height}`;
      const fit = () => {
        const scale = Math.min((innerWidth - 16) / width, (innerHeight - 16) / height);
        stage.style.transform = `scale(${scale})`;
      };
      addEventListener("resize", fit);
      fit();
    </script>
  </body>
</html>
